name: crypto-scan

on:
  workflow_dispatch:          # dipicu cron-job.org (tiap 15m) + tombol "Run workflow" manual
                              # cron bawaan GitHub (schedule) SENGAJA DIHAPUS 26 Jul 2026:
                              # dulu dia + cron-job.org bisa nyala barengan → workflow jalan 2x → notif dobel (kasus EULUSDT).

permissions:
  contents: write             # biar bisa commit state.json (dedup)

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_UPDATES: ${{ secrets.TELEGRAM_CHAT_ID_UPDATES }}
        run: node scan.js

      - name: Simpan state + journal + stats
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json journal.json stats.json
          git commit -m "update state & track record [skip ci]" || echo "tidak ada perubahan"
          git push || echo "push gagal (abaikan bila tak ada perubahan)"
